name: Next Event Project Platform - GCP Deployment
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VM_NAME: vm-platform-seed
      ZONE: asia-south2-a
      USER_NAME: sherul_dhanushka

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{secrets.GCP_WIF_PROVIDER}}
          service_account: ${{secrets.GCP_SA_EMAIL}}
          project_id: ${{secrets.GCP_PROJECT_ID}}

      - name: Set up gcloud Cloud SDK environment
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Start the vm-platform-seed instance
        run: gcloud compute instances start ${{env.VM_NAME}} --zone=${{env.ZONE}}

      - name: Connect with the vm-platform-seed through SSH, Pull the latest code & Build the project
        run: >
            gcloud compute ssh ${{env.USER_NAME}}@${{env.VM_NAME}} --zone=${{env.ZONE}}
            --command "echo 'connected with platform-seed success!' &&
            cd NextEvent-Project-Platform/ && 
            git pull --recurse-modules &&
            mvn clean package
            "